{% extends "base.html" %}
{% block content %}
<section class="page-hero">
  <div class="container">
    <div class="d-flex flex-wrap justify-content-between align-items-end gap-3">
      <div>
        <span class="eyebrow">Feedback</span>
        <h1 class="display-6 fw-bold mb-1" id="reviewsTitle">Your reviews</h1>
        <p class="text-muted mb-0" id="reviewsSubtitle">Reviews you have shared with the community.</p>
      </div>
      <div class="d-flex flex-wrap gap-2">
        <a class="btn btn-outline-brand" href="/search">Find a provider to review</a>
        <select class="form-select d-none" id="providerReviewStatus" aria-label="Filter reviews by status">
          <option value="">All statuses</option>
          <option value="approved">Approved</option>
          <option value="pending">Pending</option>
          <option value="rejected">Rejected</option>
        </select>
      </div>
    </div>
  </div>
</section>

<div class="container py-4 py-lg-5">
  <div id="reviewsContainer" aria-live="polite">
    <div class="card-soft p-4 text-muted">Loading reviews…</div>
  </div>
  <nav class="mt-4" id="reviewsPagination" aria-label="Review pages"></nav>
</div>

<div class="modal fade" id="editReviewModal" tabindex="-1" aria-labelledby="editReviewTitle" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <form id="editReviewForm" novalidate>
        <div class="modal-header">
          <h2 class="modal-title h5" id="editReviewTitle">Edit review</h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <div class="alert alert-danger d-none form-error" role="alert"></div>
          <input type="hidden" name="review_id">
          <div class="mb-3">
            <label class="form-label" for="editReviewRating">Rating</label>
            <select class="form-select" id="editReviewRating" name="rating" required>
              <option value="5">5 — Excellent</option>
              <option value="4">4 — Very good</option>
              <option value="3">3 — Average</option>
              <option value="2">2 — Poor</option>
              <option value="1">1 — Very poor</option>
            </select>
            <div class="invalid-feedback js-error d-none"></div>
          </div>
          <div class="mb-0">
            <label class="form-label" for="editReviewComment">Comment</label>
            <textarea class="form-control" id="editReviewComment" name="comment" rows="4" maxlength="2000"></textarea>
            <div class="invalid-feedback js-error d-none"></div>
          </div>
          <p class="small text-muted mt-3 mb-0">Edited reviews may return to moderation before appearing publicly.</p>
        </div>
        <div class="modal-footer border-0">
          <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-brand">Save changes</button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script src="/static/js/reviews.js"></script>
{% endblock %}

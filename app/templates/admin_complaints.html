{% extends "base.html" %}
{% block content %}
<section class="page-hero">
  <div class="container">
    <span class="eyebrow">Administration</span>
    <h1 class="display-6 fw-bold mb-1">Complaint moderation</h1>
    <p class="text-muted mb-0">Track complaints, add staff responses, and update their status.</p>
  </div>
</section>
<div class="container py-4 py-lg-5">
  <div class="admin-shell">
    {% include "_admin_nav.html" %}
    <div>
      <div id="adminComplaintsAlert"></div>
      <form class="card-soft p-3 mb-3" id="complaintFilterForm">
        <div class="row g-2 align-items-end">
          <div class="col-md-6">
            <label class="form-label" for="complaintStatusFilter">Status</label>
            <select class="form-select" id="complaintStatusFilter" name="status">
              <option value="">All statuses</option>
              <option value="open">Open</option>
              <option value="in_review">In review</option>
              <option value="resolved">Resolved</option>
              <option value="rejected">Rejected</option>
            </select>
          </div>
          <div class="col-md-6 d-flex gap-2">
            <button class="btn btn-brand flex-grow-1" type="submit">Filter</button>
            <button class="btn btn-outline-secondary" type="button" id="clearComplaintFilters">Clear</button>
          </div>
        </div>
      </form>
      <div id="adminComplaintsList"><div class="card-soft p-4 text-muted">Loading complaints…</div></div>
      <nav class="mt-3" id="adminComplaintsPagination" aria-label="Complaint pages"></nav>
    </div>
  </div>
</div>

<div class="modal fade" id="complaintUpdateModal" tabindex="-1" aria-labelledby="complaintUpdateTitle" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <form id="complaintUpdateForm">
        <div class="modal-header">
          <h2 class="modal-title h5" id="complaintUpdateTitle">Update complaint</h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <div class="alert alert-danger d-none form-error" role="alert"></div>
          <input type="hidden" name="complaint_id">
          <p class="small text-muted" id="complaintUpdateContext"></p>
          <div class="mb-3">
            <label class="form-label" for="complaintUpdateStatus">Status</label>
            <select class="form-select" id="complaintUpdateStatus" name="status" required>
              <option value="open">Open</option>
              <option value="in_review">In review</option>
              <option value="resolved">Resolved</option>
              <option value="rejected">Rejected</option>
            </select>
            <div class="invalid-feedback js-error d-none"></div>
          </div>
          <div class="mb-0">
            <label class="form-label" for="complaintResponse">Staff response</label>
            <textarea class="form-control" id="complaintResponse" name="admin_response" rows="5" maxlength="5000" placeholder="Explain the outcome or next steps for the user."></textarea>
            <div class="invalid-feedback js-error d-none"></div>
          </div>
        </div>
        <div class="modal-footer border-0">
          <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-brand">Save update</button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script src="/static/js/admin.js"></script>
{% endblock %}

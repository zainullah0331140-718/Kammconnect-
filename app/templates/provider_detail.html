{% extends "base.html" %}
{% block content %}
<div class="container py-4 py-lg-5" id="providerDetail" data-provider-id="{{ provider_id }}">
  <nav aria-label="breadcrumb" class="mb-4">
    <ol class="breadcrumb small">
      <li class="breadcrumb-item"><a href="/">Home</a></li>
      <li class="breadcrumb-item"><a href="/search">Providers</a></li>
      <li class="breadcrumb-item active" aria-current="page">Provider profile</li>
    </ol>
  </nav>
  <div id="providerContent" aria-live="polite">
    <div class="card-soft p-5 text-center text-muted">Loading provider profile…</div>
  </div>
  <section class="mt-5" id="reviewSection">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-3">
      <h2 class="h3 mb-0">Reviews</h2>
      <button class="btn btn-outline-brand d-none" type="button" id="writeReviewButton" data-bs-toggle="modal" data-bs-target="#reviewModal">
        <i class="bi bi-star me-1"></i> Write a review
      </button>
    </div>
    <div id="reviewList" class="card-soft p-4">
      <div class="text-muted small">Loading reviews…</div>
    </div>
    <nav class="mt-3" id="reviewPagination" aria-label="Review pages"></nav>
  </section>
</div>

<div class="modal fade" id="reviewModal" tabindex="-1" aria-labelledby="reviewModalTitle" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <form id="reviewForm" novalidate>
        <div class="modal-header">
          <h2 class="modal-title h5" id="reviewModalTitle">Share your experience</h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <div class="alert alert-danger d-none form-error" role="alert"></div>
          <div class="mb-3">
            <label class="form-label" for="reviewRating">Rating</label>
            <select class="form-select" id="reviewRating" name="rating" required>
              <option value="">Choose a rating</option>
              <option value="5">5 — Excellent</option>
              <option value="4">4 — Very good</option>
              <option value="3">3 — Average</option>
              <option value="2">2 — Poor</option>
              <option value="1">1 — Very poor</option>
            </select>
            <div class="invalid-feedback js-error d-none"></div>
          </div>
          <div class="mb-0">
            <label class="form-label" for="reviewComment">Comment <span class="text-muted fw-normal">(optional)</span></label>
            <textarea class="form-control" id="reviewComment" name="comment" rows="4" maxlength="2000" placeholder="What was the work like? Was the provider clear and reliable?"></textarea>
            <div class="form-text">Do not include private contact information.</div>
            <div class="invalid-feedback js-error d-none"></div>
          </div>
        </div>
        <div class="modal-footer border-0">
          <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-brand">Submit review</button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script src="/static/js/provider.js"></script>
{% endblock %}
